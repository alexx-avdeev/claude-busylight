[package]
name = "busylight"
version = "0.2.0"
edition = "2021"
description = "Kuando Busylight status indicator for Claude Code"
license = "0BSD"

[[bin]]
name = "busylight"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
